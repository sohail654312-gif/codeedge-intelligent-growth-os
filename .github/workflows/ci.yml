name: CIGO CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; upstream action.yml verified
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0; upstream action.yml verified
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Require committed lockfile and record toolchain
        run: |
          git ls-files --error-unmatch package-lock.json
          node --version
          npm --version
      - name: Install from reviewed lockfile only
        run: npm ci --ignore-scripts
      - name: Check authoritative STATE / HANDOFF mirror (M-07)
        run: node scripts/check-governance-mirror.mjs
      - name: Verify typecheck, build and mandatory non-skipped unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run verify | tee "$RUNNER_TEMP/cigo-unit-tests.log"
          node scripts/check-test-summary.mjs "$RUNNER_TEMP/cigo-unit-tests.log" 270
      - name: High-severity dependency audit
        run: npm run security:dependencies
      - name: Build synthetic read-only preview and verify presentation boundaries
        shell: bash
        run: |
          set -o pipefail
          npm run test:preview | tee "$RUNNER_TEMP/cigo-preview-tests.log"
          node scripts/check-test-summary.mjs "$RUNNER_TEMP/cigo-preview-tests.log" 8
      - name: Validate locked component provenance
        run: npm run security:provenance
      - name: Generate and verify CycloneDX SBOM
        run: |
          npm sbom --sbom-format cyclonedx > "$RUNNER_TEMP/cigo-sbom.cdx.json"
          node scripts/check-sbom.mjs "$RUNNER_TEMP/cigo-sbom.cdx.json"
      - name: Attach exact-build SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2; upstream action.yml verified
        with:
          name: cigo-cyclonedx-sbom
          path: ${{ runner.temp }}/cigo-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7
